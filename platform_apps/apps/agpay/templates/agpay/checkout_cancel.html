{% extends "agpay/base.html" %}
{% block title %}Checkout Cancelled | AgPay{% endblock %}
{% block content %}
  <section class="card status-card">
    <div class="eyebrow">Checkout cancelled</div>
    <h1>No payment was made.</h1>
    <p class="muted">Order #{{ order.id }} is still pending. You can return to the merchant page and try again.</p>
    <a class="btn" href="{% url 'agpay:dashboard' %}">Back to AgPay</a>
  </section>
{% endblock %}
