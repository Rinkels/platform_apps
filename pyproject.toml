[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-apps"
version = "0.1.3"
description = "Shared platform apps for DealerMaster and related systems"
requires-python = ">=3.13"
dependencies = [
    "Django>=6.0,<6.1",
    "stripe>=13.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["platform_apps*"]

[tool.setuptools.package-data]
"platform_apps.apps.common" = [
    "templates/**/*.html",
]
"platform_apps.apps.core" = [
    "templates/**/*.html",
]
"platform_apps.apps.ui_shell" = [
    "templates/**/*.html",
]
"platform_apps.apps.agpay" = [
    "templates/**/*.html",
]
